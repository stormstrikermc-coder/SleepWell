name: Feature request
description: Suggest an improvement for SleepWell.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Search existing issues first so related ideas can be discussed together."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how you would expect the feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add examples or screenshots if they help explain the request.
    validations:
      required: false
